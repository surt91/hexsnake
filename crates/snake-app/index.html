<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexSnake</title>
    <!-- trunk builds the wasm binary and injects the loader here -->
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <base data-trunk-public-url />
    <style>
        html {
            touch-action: manipulation;
        }

        body {
            background: #181818;
        }

        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, 0%);
        }
    </style>
</head>

<body>
    <canvas id="hexsnake_canvas"></canvas>
</body>

</html>
